services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ai_coworker_systemtest
      POSTGRES_USER: ai_coworker
      POSTGRES_PASSWORD: test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_coworker -d ai_coworker_systemtest"]
      interval: 2s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 12
