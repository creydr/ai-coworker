database:
  url: "postgres://ai-coworker:password@localhost:5432/ai-coworker?sslmode=disable"

llm:
  provider: "claude"
  model: "claude-sonnet-4-6"

slack:
  enabled: false

github:
  enabled: false
  # listenAddr: ":8080"
  allowedUsers:
    - "*"

sandbox:
  runtime: "docker"
  image: "quay.io/creydr/ai-coworker-sandbox:latest"
  timeoutSeconds: 600
  cpuLimit: "2"
  memoryLimit: "2Gi"
  # namespace: "ai-coworker"      # required for kubernetes runtime
  # serviceAccount: ""            # optional SA for sandbox job pods
  # skillImages:                  # OCI skill images to mount into sandbox
  #   - "quay.io/myorg/my-skills:latest"

workers: 4
