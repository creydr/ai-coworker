database:
  url: "postgres://ai_coworker:ai_coworker@localhost:5432/ai_coworker?sslmode=disable"

llm:
  provider: "claude"
  model: "claude-sonnet-4-20250514"

slack:
  enabled: false

github:
  enabled: false

sandbox:
  runtime: "docker"
  image: "quay.io/creydr/ai-coworker-sandbox:latest"
  timeout_seconds: 600
  cpu_limit: "2"
  memory_limit: "2Gi"
  namespace: ""

workers: 4
