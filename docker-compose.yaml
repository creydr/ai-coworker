services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ai-coworker
      POSTGRES_PASSWORD: password
      POSTGRES_DB: ai-coworker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  postgres-systemtest:
    image: postgres:17
    environment:
      POSTGRES_USER: ai_coworker
      POSTGRES_PASSWORD: test
      POSTGRES_DB: ai_coworker_systemtest
    ports:
      - "5433:5432"

volumes:
  pgdata:
