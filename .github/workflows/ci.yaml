name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      - name: Vet
        run: make vet

      - name: Unit Tests
        run: make test

  integration:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ai-coworker
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ai-coworker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai-coworker"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Integration Tests
        env:
          TEST_DATABASE_URL: postgres://ai-coworker:password@localhost:5432/ai-coworker?sslmode=disable
        run: make test-integration

  systemtest:
    runs-on: ubuntu-latest
    needs: [lint, unit]
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ai_coworker
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ai_coworker_systemtest
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ai_coworker"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        run: |
          ollama serve &
          sleep 5

      - name: Pull model
        run: ollama pull qwen2.5:0.5b

      - name: Build test sandbox image
        run: docker build -t ai-coworker-systemtest-sandbox:latest -f test/systemtest/sandbox/Dockerfile test/systemtest/sandbox/

      - name: System Tests
        env:
          SYSTEMTEST_DATABASE_URL: postgres://ai_coworker:test@localhost:5433/ai_coworker_systemtest?sslmode=disable
          SYSTEMTEST_OLLAMA_URL: http://localhost:11434/v1
        run: make test-systemtest
