name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ai-coworker
          POSTGRES_PASSWORD: password
          POSTGRES_DB: ai-coworker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai-coworker"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        env:
          TEST_DATABASE_URL: postgres://ai-coworker:password@localhost:5432/ai-coworker?sslmode=disable
        run: go test ./...
