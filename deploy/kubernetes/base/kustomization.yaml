apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai-coworker

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - role.yaml
  - rolebinding.yaml
  - configmap.yaml
  - secret.yaml
  - deployment.yaml
  - service.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: ai-coworker
    includeSelectors: false

images:
  - name: quay.io/creydr/ai-coworker
    newTag: latest
