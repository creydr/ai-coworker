apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-coworker
data:
  config.yaml: |
    # database.url is overridden by AI_COWORKER__DATABASE__URL from the Secret
    database: {}

    llm:
      provider: "claude"
      model: "claude-sonnet-4-6"

    sandbox:
      runtime: "kubernetes"
      image: "quay.io/creydr/ai-coworker-sandbox:latest"
      timeout_seconds: 600
      cpu_limit: "2"
      memory_limit: "2Gi"
      namespace: "ai-coworker"

    github:
      enabled: false
      listen_addr: ":8080"

    slack:
      enabled: false

    workers: 4
