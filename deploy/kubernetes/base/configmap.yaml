apiVersion: v1
kind: ConfigMap
metadata:
  name: ai-coworker
data:
  config.yaml: |
    listen_addr: ":8080"

    database:
      url: "postgres://ai-coworker:password@postgres:5432/ai-coworker?sslmode=disable"

    llm:
      provider: "claude"
      model: "claude-sonnet-4-6"

    sandbox:
      runtime: "kubernetes"
      image: "quay.io/creydr/ai-coworker-sandbox:latest"
      timeout_seconds: 600
      cpu_limit: "2"
      memory_limit: "2Gi"
      namespace: "ai-coworker"

    github:
      enabled: false

    slack:
      enabled: false

    workers: 4
