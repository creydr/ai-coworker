apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-coworker
  labels:
    app.kubernetes.io/name: ai-coworker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ai-coworker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ai-coworker
    spec:
      serviceAccountName: ai-coworker
      containers:
        - name: ai-coworker
          image: quay.io/creydr/ai-coworker:latest
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          envFrom:
            - secretRef:
                name: ai-coworker
          volumeMounts:
            - name: config
              mountPath: /config.yaml
              subPath: config.yaml
              readOnly: true
          resources:
            limits:
              cpu: "500m"
              memory: "256Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: ai-coworker
