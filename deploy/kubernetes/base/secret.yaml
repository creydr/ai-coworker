apiVersion: v1
kind: Secret
metadata:
  name: ai-coworker
type: Opaque
stringData:
  # Required: PostgreSQL connection string
  AI_COWORKER__DATABASE__URL: "postgres://ai-coworker:password@postgres:5432/ai-coworker?sslmode=disable"

  # Required: LLM API key (for claude provider)
  AI_COWORKER__LLM__API_KEY: "CHANGE_ME"

  # Optional: GitHub App credentials
  # AI_COWORKER__GITHUB__ENABLED: "true"
  # AI_COWORKER__GITHUB__APP_ID: ""
  # AI_COWORKER__GITHUB__PRIVATE_KEY: ""
  # AI_COWORKER__GITHUB__WEBHOOK_SECRET: ""
  # AI_COWORKER__GITHUB__BOT_USERNAME: ""

  # Optional: Slack credentials
  # AI_COWORKER__SLACK__ENABLED: "true"
  # AI_COWORKER__SLACK__APP_TOKEN: ""
  # AI_COWORKER__SLACK__BOT_TOKEN: ""
